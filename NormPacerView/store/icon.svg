<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green at the tick, out through blue and red to purple at both ends. -->
    <linearGradient id="trend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a040ff"/>
      <stop offset="0.167" stop-color="#ff3b30"/>
      <stop offset="0.333" stop-color="#1e9bff"/>
      <stop offset="0.5" stop-color="#2ecc40"/>
      <stop offset="0.667" stop-color="#1e9bff"/>
      <stop offset="0.833" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#a040ff"/>
    </linearGradient>
  </defs>
  <!-- Ground -->
  <rect width="128" height="128" fill="#101010"/>
  <!-- Far hills -->
  <path d="M0 76 C 14 56, 30 54, 44 68 C 56 80, 70 34, 90 38 C 106 42, 116 62, 128 70 L128 128 L0 128 Z" fill="#2e2e2e"/>
  <!-- Near hills -->
  <path d="M0 102 C 16 84, 34 82, 50 94 C 64 104, 78 74, 98 76 C 112 77, 120 92, 128 96 L128 128 L0 128 Z" fill="#4a4a4a"/>
  <!-- Horizon bar -->
  <rect x="12" y="57" width="104" height="14" fill="url(#trend)"/>
  <!-- Zero tick -->
  <rect x="63" y="52" width="2" height="24" fill="#ffffff"/>
  <!-- App name, split around the horizon -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">
    <text x="65" y="40">NORM</text>
    <text x="65" y="106">PACER</text>
  </g>
</svg>
